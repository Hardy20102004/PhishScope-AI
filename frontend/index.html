<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    
    <!-- Google Translate Widget Configuration -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    <!-- Hide the default Google Translate UI elements -->
    <style>
      /* Hide the banner frame */
      .goog-te-banner-frame.skiptranslate, 
      .goog-te-banner-frame, 
      iframe.goog-te-banner-frame { 
        display: none !important; 
      }
      /* Hide modern Google Translate banner classes */
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf {
        display: none !important;
      }
      /* Hide any iframe injected directly as a direct child of body by Google */
      body > .skiptranslate > iframe {
        display: none !important;
      }
      body { 
        top: 0px !important; 
        position: static !important; 
      }
      html {
        top: 0px !important;
        position: static !important;
      }
      #google_translate_element { 
        position: absolute;
        top: -10000px;
        left: -10000px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      #goog-gt-tt, .goog-tooltip { display: none !important; }
      .goog-text-highlight { background-color: transparent !important; box-shadow: none !important; }
    </style>
  </head>
  <body>
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
