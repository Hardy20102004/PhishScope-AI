apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phoenix-ingress
  namespace: phoenix-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  tls:
  - hosts:
    - app.phoenix-platform.com
    secretName: phoenix-tls-secret
  rules:
  - host: app.phoenix-platform.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: phoenix-backend-svc
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: phoenix-frontend-svc
            port:
              number: 80
