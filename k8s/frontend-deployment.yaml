apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix-frontend
  namespace: phoenix-prod
  labels:
    app: phoenix-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: phoenix-frontend
  template:
    metadata:
      labels:
        app: phoenix-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/phoenix/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 15
